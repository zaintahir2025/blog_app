name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x' # Using a modern 3.x version
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web App
        # Set base href to /blog_app/ because the repository name is blog_app
        run: flutter build web --base-href "/blog_app/" --release

      - name: SPA Routing Fallback
        # Copy index.html to 404.html so GitHub Pages can handle direct routing correctly
        run: cp build/web/index.html build/web/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
